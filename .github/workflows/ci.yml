name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.17.1-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.17.1-
      - name: Build, wrapper tests and upstream layer tests
        run: zig build bindings test test-upstream
      - name: Run the example
        working-directory: examples/relu
        run: zig build run

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-windows-gnu
          - aarch64-macos
          - aarch64-linux-gnu
          - arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.17.1-${{ matrix.target }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.17.1-${{ matrix.target }}-
      - name: Build bindings for ${{ matrix.target }}
        run: zig build bindings -Dtarget=${{ matrix.target }}
