name: Check

on:
  push:
  pull_request:

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Check formatting
        run: zig fmt --check build.zig src test examples/relu/build.zig examples/relu/src

  dispatch:
    name: Dispatch subsets
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Baseline only
        run: zig build test -Dx86_isa=off

      - name: AVX2 subset
        run: zig build test-upstream -Dx86_isa=avx,avx2

      - name: AArch64 subset
        run: zig build bindings -Dtarget=aarch64-linux-gnu -Darm_isa=asimdhp,asimddp -Dbf16=false

      - name: Reject invalid subsets
        shell: bash
        run: |
          ! zig build bindings -Dx86_isa=avx2
          ! zig build bindings -Dx86_isa=all,avx2
          ! zig build bindings -Dtarget=aarch64-linux-gnu -Darm_isa=asimddp
          ! zig build bindings -Dtarget=aarch64-linux-gnu -Druntime_cpu=false

  test:
    name: Build and test (${{ matrix.platform }})
    needs: fmt
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x86_64
            runs_on: ubuntu-latest
            upstream: true
          - platform: linux arm64
            runs_on: ubuntu-24.04-arm
            upstream: true
          - platform: macOS x86_64
            runs_on: macos-15-intel
            upstream: true
          - platform: macOS arm64
            runs_on: macos-latest
            upstream: true
          - platform: windows x86_64
            runs_on: windows-latest
            upstream: false
          - platform: windows arm64
            runs_on: windows-11-arm
            upstream: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Run wrapper tests
        run: zig build test

      - name: Run upstream layer tests
        if: matrix.upstream
        run: zig build test-upstream

      - name: Check example package contract
        working-directory: examples/relu
        shell: bash
        run: zig build run

  cross:
    name: Cross build (${{ matrix.target }})
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux-gnu
          - arm-linux-gnueabihf
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build bindings for ${{ matrix.target }}
        run: zig build bindings -Dtarget=${{ matrix.target }}

  required:
    name: Build and test
    needs: [test, cross]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every target
        env:
          TEST: ${{ needs.test.result }}
          CROSS: ${{ needs.cross.result }}
        run: test "$TEST" = "success" && test "$CROSS" = "success"
