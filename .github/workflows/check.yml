name: Check

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      fmt: ${{ steps.filter.outputs.fmt }}
      lib: ${{ steps.filter.outputs.lib }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            fmt:
              - '**/*.zig'
              - '.github/workflows/check.yml'
            lib:
              - 'build.zig'
              - 'build.zig.zon'
              - 'src/**'
              - 'test/**'
              - '.github/workflows/check.yml'
            examples:
              - 'examples/**/*.zig'
              - 'examples/**/*.zon'
              - 'examples/**/src/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'src/**'
              - '.github/workflows/check.yml'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Check formatting
        run: zig fmt --check build.zig src test examples/relu/build.zig examples/relu/src examples/ppocrv6/build.zig examples/ppocrv6/src

  dispatch:
    name: Dispatch subsets
    needs: [changes, fmt]
    if: |
      !cancelled() && needs.changes.outputs.lib == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Baseline only
        run: zig build test -Dx86_isa=off

      - name: AVX2 subset
        run: zig build test-upstream -Dx86_isa=avx,avx2

      - name: AArch64 subset
        run: zig build bindings -Dtarget=aarch64-linux-gnu -Darm_isa=asimdhp,asimddp -Dbf16=false

      - name: Layer subset
        run: zig build test -Dx86_isa=off -Dlayers=Input,ReLU,Convolution,Packing,Flatten,Padding,Cast,Bias,Scale

      - name: Reject invalid subsets
        shell: bash
        run: |
          ! zig build bindings -Dx86_isa=avx2
          ! zig build bindings -Dx86_isa=all,avx2
          ! zig build bindings -Dtarget=aarch64-linux-gnu -Darm_isa=asimddp
          ! zig build bindings -Dtarget=aarch64-linux-gnu -Druntime_x86=false
          ! zig build bindings -Dlayers=Input,NoSuchLayer

  test:
    name: Build and test (${{ matrix.platform }})
    needs: [changes, fmt]
    if: |
      !cancelled() && needs.changes.outputs.lib == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped')
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x86_64
            runs_on: ubuntu-latest
            upstream: true
          - platform: linux arm64
            runs_on: ubuntu-24.04-arm
            upstream: true
          - platform: macOS x86_64
            runs_on: macos-15-intel
            upstream: true
          - platform: macOS arm64
            runs_on: macos-latest
            upstream: true
          - platform: windows x86_64
            runs_on: windows-latest
            upstream: false
          - platform: windows arm64
            runs_on: windows-11-arm
            upstream: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Run wrapper tests
        run: zig build test

      - name: Run upstream layer tests
        if: matrix.upstream
        run: zig build test-upstream

  examples:
    name: Examples (${{ matrix.platform }})
    needs: [changes, fmt]
    if: |
      !cancelled() && needs.changes.outputs.examples == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped')
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x86_64
            runs_on: ubuntu-latest
            ppocrv6: true
          - platform: macOS arm64
            runs_on: macos-latest
            ppocrv6: false
          - platform: windows x86_64
            runs_on: windows-latest
            ppocrv6: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Check example package contract
        working-directory: examples/relu
        shell: bash
        run: zig build run

      - name: Run ppocrv6 example
        if: matrix.ppocrv6
        working-directory: examples/ppocrv6
        shell: bash
        run: |
          output=$(zig build run 2>&1)
          echo "$output"
          grep -Fq "output: 48x6906" <<<"$output"
          grep -Fq "text: 绿洲仕格维花园公寓" <<<"$output"

  cross:
    name: Cross build (${{ matrix.target }})
    needs: [changes, fmt]
    if: |
      !cancelled() && needs.changes.outputs.lib == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux-gnu
          - arm-linux-gnueabihf
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build bindings for ${{ matrix.target }}
        run: zig build bindings -Dtarget=${{ matrix.target }}

  required:
    name: Build and test
    needs: [changes, fmt, dispatch, test, examples, cross]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected target
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          FMT: ${{ needs.fmt.result }}
          DISPATCH: ${{ needs.dispatch.result }}
          TEST: ${{ needs.test.result }}
          EXAMPLES: ${{ needs.examples.result }}
          CROSS: ${{ needs.cross.result }}
        run: |
          failed=0
          for result in "$CHANGES" "$FMT" "$DISPATCH" "$TEST" "$EXAMPLES" "$CROSS"; do
            case "$result" in
              success|skipped) ;;
              *) echo "job result: $result"; failed=1 ;;
            esac
          done
          exit "$failed"
